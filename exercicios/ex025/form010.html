<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

<p>
    <label for="iano">Ano em que nasceu</label>
    <input type="number" name="ano" id="iano" min="1990" max="2030" oninput="calIdade()">
</p>

<p>
    <label for="iidade">Tua idade:</label>
    <output id="iidade">0</output>
</p>



<input type="submit" value="Enviar">
<input type="reset" value="Limpar">

    </form>

    <script>
    
    function calIdade() {
        let atual = new Date().getFullYear()
        iidade.innerHTML = Number(atual) - Number(iano.value)
    }
    
    </script>
</body>
</html>
