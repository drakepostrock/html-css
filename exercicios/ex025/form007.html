<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="">
<label for="iest">Estado</label>
<select name="estado" id="iestado">
    <option value="" selected>Escolha</option>
<optgroup label="regiao norte">
    <option value="bg" >Braga</option>
    <option value="pt" >porto</option>
</optgroup>

<optgroup label="regiao sul">
    <option value="lb">lisboa</option>
    <option value="ag">algarve</option>
</optgroup>



</select>

<p>
    <label for="iprof">profissao</label>
    <input type="text" name="prof" id="iprof" list="istprof">
    <datalist id="istprof">
        <option value="ad">administrador</option>
        <option value="ct">contabilista</option>
    </datalist>
</p>

<p>
    <label for="imsg">Mensagem</label><br>
    <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
</p>

<p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</p>


    </form>
</body>
</html>
