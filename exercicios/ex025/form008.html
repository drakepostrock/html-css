<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>

    <form action="cadastro.php" method="get">

<p>
    <label for="in1">Numero 1:</label>
    <input type="number" name="n1" id="in1" max="50" required
    oninput="isoma.innerHTML= Number(in1.value) + Number(in2.value)">
</p>

<p>
        <label for="in2">Numero 2:</label>
        <input type="number" name="n2" id="in2" max="50" required
        oninput="isoma.innerHTML= Number(in1.value) + Number(in2.value)">
    </p>

    <p>
        <label for="isoma">Soma:</label>
        <output soma="soma" id="isoma">0</output>
    </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
